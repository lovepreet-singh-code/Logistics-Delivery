events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    keepalive_timeout  65;

    # Global CORS settings can also be defined if necessary, but typically applied per-location or globally within server block
    
    server {
        listen 8080;
        server_name localhost;

        # Global CORS Configuration
        add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, User-Agent, DNT, Cache-Control, X-Mx-ReqToken, Keep-Alive, X-Requested-With, If-Modified-Since' always;

        # Handle Preflight OPTIONS requests for all routes
        location = /_cors_preflight {
            internal;
            add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, User-Agent, DNT, Cache-Control, X-Mx-ReqToken, Keep-Alive, X-Requested-With, If-Modified-Since' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # ──── Route: Identity Service ────
        location /api/auth/ {
            if ($request_method = 'OPTIONS') {
                rewrite ^ /_cors_preflight last;
            }
            proxy_pass http://identity-service:4001/api/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ──── Route: Topology Service ────
        location /api/topology/ {
            if ($request_method = 'OPTIONS') {
                rewrite ^ /_cors_preflight last;
            }
            proxy_pass http://topology-service:4002/api/topology/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ──── Route: Fleet Service ────
        location /api/fleet/ {
            if ($request_method = 'OPTIONS') {
                rewrite ^ /_cors_preflight last;
            }
            proxy_pass http://fleet-service:4003/api/fleet/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ──── Route: Order Service ────
        location /api/orders/ {
            if ($request_method = 'OPTIONS') {
                rewrite ^ /_cors_preflight last;
            }
            proxy_pass http://order-service:4004/api/orders/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ──── Route: Dispatch Service ────
        location /api/dispatch/ {
            if ($request_method = 'OPTIONS') {
                rewrite ^ /_cors_preflight last;
            }
            proxy_pass http://dispatch-service:4005/api/dispatch/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
