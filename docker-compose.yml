version: "3.9"

services:
  # ──── INFRASTRUCTURE ────
  mongodb:
    image: mongo:7.0
    container_name: logistics-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin_secret
      MONGO_INITDB_DATABASE: logistics_platform
    volumes:
      - mongodb_data:/data/db
    networks:
      - logistics-network

  redis:
    image: redis:7.2-alpine
    container_name: logistics-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass redis_secret
    volumes:
      - redis_data:/data
    networks:
      - logistics-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: logistics-zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - logistics-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: logistics-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - logistics-network

  # ──── MICROSERVICES ────
  # (No ports mapped to host machine, only accessible via the internal network)

  identity-service:
    build: ./identity-service
    container_name: logistics-identity-service
    restart: unless-stopped
    networks:
      - logistics-network
    environment:
      - MONGO_URI=mongodb://admin:admin_secret@mongodb:27017/logistics_platform?authSource=admin
      - REDIS_URL=redis://:redis_secret@redis:6379
      - JWT_SECRET=fallback_secret_for_docker
    depends_on:
      - mongodb
      - redis

  topology-service:
    build: ./topology-service
    container_name: logistics-topology-service
    restart: unless-stopped
    environment:
      - KAFKA_BROKERS=kafka:9092
      - MONGO_URI=mongodb://admin:admin_secret@mongodb:27017/logistics_platform?authSource=admin
      - REDIS_HOST=redis
    networks:
      - logistics-network
    depends_on:
      - mongodb
      - redis
      - kafka

  fleet-service:
    build: ./fleet-service
    container_name: logistics-fleet-service
    restart: unless-stopped
    environment:
      - MONGO_URI=mongodb://admin:admin_secret@mongodb:27017/logistics_platform?authSource=admin
      - REDIS_HOST=redis
    networks:
      - logistics-network
    depends_on:
      - mongodb
      - redis

  order-service:
    build: ./order-service
    container_name: logistics-order-service
    restart: unless-stopped
    environment:
      - KAFKA_BROKER=kafka:9092
      - REDIS_URL=redis://:redis_secret@redis:6379
      - MONGO_URI=mongodb://admin:admin_secret@mongodb:27017/logistics_platform?authSource=admin
    networks:
      - logistics-network
    depends_on:
      - mongodb
      - kafka

  dispatch-service:
    build: ./dispatch-service
    container_name: logistics-dispatch-service
    restart: unless-stopped
    environment:
      - KAFKA_BROKERS=kafka:9092
      - MONGO_URI=mongodb://admin:admin_secret@mongodb:27017/logistics_platform?authSource=admin
      - ORDER_SERVICE_URL=http://order-service:4004
      - FLEET_SERVICE_URL=http://fleet-service:4003
      - PORT=4005
    networks:
      - logistics-network
    depends_on:
      - mongodb
      - kafka

  # ──── API GATEWAY ────
  api-gateway:
    build: ./api-gateway
    container_name: logistics-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - logistics-network
    depends_on:
      - identity-service
      - topology-service
      - fleet-service
      - order-service
      - dispatch-service

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  zookeeper_data:
    driver: local
  kafka_data:
    driver: local

networks:
  logistics-network:
    driver: bridge
